<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalCore</title>
    <script>
      // Applies the saved theme before first paint so there is no flash.
      // Keep the key in sync with THEME_STORAGE_KEY in src/constants/theme.js.
      (function () {
        try {
          var saved = localStorage.getItem("dentalcore-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var accent = localStorage.getItem("dentalcore-accent") || "violet";
          var map = {
            violet: ["#6d4ae5", "#8f73f5"],
            blue: ["#2563eb", "#60a5fa"],
            teal: ["#0d9488", "#2dd4bf"],
            green: ["#16a34a", "#4ade80"],
            rose: ["#e11d48", "#fb7185"],
            orange: ["#ea580c", "#fb923c"],
            slate: ["#475569", "#94a3b8"],
            indigo: ["#4f46e5", "#818cf8"],
          };
          var pair = map[accent] || map.violet;
          document.documentElement.style.setProperty("--primary", dark ? pair[1] : pair[0]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
