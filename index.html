<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalCore</title>
    <script>
      // Applies the saved theme before first paint so there is no flash.
      // Keep the key in sync with THEME_STORAGE_KEY in src/constants/theme.js.
      (function () {
        try {
          var saved = localStorage.getItem("dentalcore-theme");
          var dark = saved
            ? saved === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
